# 트랙 A — 실스캔(organized Zivid 격자)에 결함을 2.5D 로 주입한다.
# 결측·노이즈·해상도는 실데이터 그대로. 우리가 더하는 것은 매끈한 변위와 그에 따른 음영뿐.

scans:
  - name: bumper_cover
    zdf: data/2-2.zdf
    part_mode: above        # 지그 판(가장 큰 평면) 위에 뜬 것이 부품
    part_margin_mm: 4.0
    normal_step: 3          # measure.py: SDK 법선 노이즈 2.05° 에 가장 가까운 차분 폭(2.11°)
    # Existing dent: provisional conservative exclusion, review ignore.png before training.
    exclude_circles_px: [[559, 1114, 220]]
    shading: {ambient: 0.2, specular: 0.0, shininess: 32.0}
    # 결함이 부품 안에 온전히 들어오고 얇은 탭을 피하도록 마스크를 이만큼 침식한다
    placement_erode_mm: 30.0
    defects:
      dent:
        count: [1, 3]
        radius_mm: [6, 25]        # 실물 찍힘 계측 후 교체 (measure.py)
        depth_mm: [0.5, 3.0]      # Experimental range; minimum detectable depth is not yet calibrated.
        rim_height_mm: [0.0, 0.25] # Peak outward height, experimental (not fitted)
        aspect: [1.0, 1.8]        # 타원 비율
      scratch:
        count: [0, 2]
        length_mm: [20, 120]
        width_mm: [0.6, 2.0]
        depth_mm: [0.2, 0.8]
        rgb_gain: [0.6, 1.4]      # 홈 안 밝기 배율 (<1 어둡게, >1 밝게)

  - name: weld_bracket
    zdf: data/0023.zdf
    part_mode: near         # 부품 앞면이 가장 큰 평면
    part_window_mm: 30.0
    placement_erode_mm: 12.0
    defects:
      dent:
        count: [1, 2]
        radius_mm: [4, 12]
        depth_mm: [0.5, 2.0]
        aspect: [1.0, 1.5]
      scratch:
        count: [0, 2]
        length_mm: [10, 60]
        width_mm: [0.5, 1.5]
        depth_mm: [0.2, 0.6]
        rgb_gain: [1.1, 1.6]      # 맨 철판은 긁히면 밝아진다

classes: {scratch: 0, dent: 1, paint_defect: 2, weld_defect: 3}
